name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Linux x86-64
    runs-on: ubuntu-24.04
    container: gcc:16.2.0-trixie
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends libncurses-dev python3

      - name: Run debug tests
        run: make --jobs=2 MODE=debug test

      - name: Run release tests
        run: make --jobs=2 MODE=release test

      - name: Check allocation cleanup and failure paths
        run: make MODE=release memcheck

      - name: Save tested binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-binary
          path: log-viewer
          if-no-files-found: error
          retention-days: 7

  test-and-build-macos:
    name: Test and build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install gcc@15 ncurses make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"

      - name: Run debug and release tests
        run: |
          ncurses_prefix="$(brew --prefix ncurses)"
          test -f "$ncurses_prefix/lib/libncursesw.a"
          make --jobs=2 CC=gcc-15 MODE=debug \
            NCURSES_LIBS="$ncurses_prefix/lib/libncursesw.a" LDFLAGS=-static-libgcc test
          make --jobs=2 CC=gcc-15 MODE=release \
            NCURSES_LIBS="$ncurses_prefix/lib/libncursesw.a" LDFLAGS=-static-libgcc test

      - name: Sign and verify standalone binary
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(lipo -archs log-viewer)" = "$EXPECTED_ARCH"
          codesign --force --sign - --timestamp=none log-viewer
          codesign --verify --strict --verbose=2 log-viewer
          python3 .github/scripts/check_macos_binary.py log-viewer

      - name: Test signed binary with system terminal definitions
        env:
          TERMINFO: /usr/share/terminfo
          TERMINFO_DIRS: /usr/share/terminfo
        run: |
          ./log-viewer --help
          python3 tests/test.py

      - name: Stage binary and third-party license
        run: |
          mkdir -p build/macos/licenses
          install -m 755 log-viewer build/macos/log-viewer
          cp "$(brew --prefix ncurses)/COPYING" build/macos/licenses/ncurses.txt

      - name: Save tested macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-binary
          path: build/macos/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, test-and-build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Keep version selection and publication in one serialized transaction.
    concurrency:
      group: publish-main-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select semantic version and prepare notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # A newer main commit includes these changes in its own release notes.
          head_commit="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head_commit" != "$RELEASE_COMMIT" ]; then
            echo 'Skipping superseded main commit.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/release_notes.py \
            --repository "$GH_REPO" \
            --commit "$RELEASE_COMMIT" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --output "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Download tested Linux binary
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-binary
          path: build/tested/linux-x86_64/

      - name: Download tested Apple Silicon binary
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-binary
          path: build/tested/macos-arm64/

      - name: Download tested Intel Mac binary
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-binary
          path: build/tested/macos-x86_64/

      - name: Package release
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          mkdir -p dist
          for platform in linux-x86_64 macos-arm64 macos-x86_64; do
            package="log-viewer-${RELEASE_TAG}-${platform}"
            mkdir -p "build/package/$package/include"
            install -m 755 "build/tested/$platform/log-viewer" "dist/log-viewer-$platform"
            install -m 755 "build/tested/$platform/log-viewer" "build/package/$package/log-viewer"
            cp LICENSE README.md "build/package/$package/"
            cp -R docs "build/package/$package/"
            cp include/json.h "build/package/$package/include/"
            if [ -d "build/tested/$platform/licenses" ]; then
              cp -R "build/tested/$platform/licenses" "build/package/$package/"
            fi
            tar -C build/package -czf "dist/$package.tar.gz" "$package"
          done
          cp build/tested/macos-arm64/licenses/ncurses.txt dist/NCURSES-LICENSE.txt
          cd dist
          sha256sum log-viewer-* NCURSES-LICENSE.txt > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release and upload binaries
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
