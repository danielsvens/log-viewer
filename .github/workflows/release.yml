name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Linux x86-64
    runs-on: ubuntu-24.04
    container: gcc:16.2.0-trixie
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends libncurses-dev python3

      - name: Run debug tests
        run: make --jobs=2 MODE=debug test

      - name: Run release tests
        run: make --jobs=2 MODE=release test

      - name: Check allocation cleanup and failure paths
        run: make MODE=release memcheck

      - name: Save tested binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-binary
          path: log-viewer
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Keep version selection and publication in one serialized transaction.
    concurrency:
      group: publish-main-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select semantic version and prepare notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # A newer main commit includes these changes in its own release notes.
          head_commit="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head_commit" != "$RELEASE_COMMIT" ]; then
            echo 'Skipping superseded main commit.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/release_notes.py \
            --repository "$GH_REPO" \
            --commit "$RELEASE_COMMIT" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --output "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Download tested binary
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-binary
          path: build/tested/

      - name: Package release
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          package="log-viewer-${RELEASE_TAG}-linux-x86_64"
          mkdir -p "build/package/$package/include" dist
          install -m 755 build/tested/log-viewer dist/log-viewer-linux-x86_64
          install -m 755 build/tested/log-viewer "build/package/$package/log-viewer"
          cp LICENSE README.md "build/package/$package/"
          cp -R docs "build/package/$package/"
          cp include/json.h "build/package/$package/include/"
          tar -C build/package -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum log-viewer-linux-x86_64 "$package.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release and upload binaries
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
